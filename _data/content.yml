name: Alexander Eckerlin
subtitle: "AI Enablement, interne KI-Tools, Automatisierung | Senior Managing Editor"
location: "Metropolregion Rhein-Neckar"
availability: "Offen für neue Herausforderungen"
seeking: "AI Enablement · Interne KI-Werkzeuge · Prozessautomatisierung"
email: "a.eckerlin@gmx.de"
linkedin: "alexander-eckerlin"
github: "ecklex"
intro: |-
  Halluzinierte Literaturverzeichnisse kosten Verlage Stunden der Prüfung. Ich habe eine App gebaut, die diese Einträge per API gegen Fachdatenbanken abgleicht: Aus 2 Stunden Handarbeit werden zehn Minuten.

  Als Verantwortlicher für digitale Barrierefreiheit habe ich unser laufendes Programm auf BFSG-Konformität umgestellt – vor der gesetzlichen Frist.

  Als Senior Managing Editor habe ich für dieses Fachprogramm bisher rund 180 Titel produziert, mit Markdown-Publishing-Pipelines experimentiert und mehrere KI-Werkzeuge für die Redaktion entwickelt. Daran entzündet sich meine Begeisterung: Use Cases im Alltag erkennen, Lösungen entwerfen, gemeinsam anwenden. Das funktioniert in jeder Branche.

  Germanistik, korpuslinguistische Forschung, Verlagslektorat, KI-gestützte Anwendungsentwicklung und redaktionelle Automatisierung, eigene KI-Tools. Was wie Umwege aussieht, ist meine Natur: Ich arbeite mich schnell in fremde Felder ein und verbinde sie, stelle Kreuzbezüge her.
source_note: >-
  Diese Seite und das CV-PDF werden aus einer einzigen Datenquelle erzeugt — ein
  Single-Source-Publishing-Setup, das öffentlich einsehbar läuft.
source_repo: "https://github.com/ecklex/personal-webpage"

# Die `id`-Felder adressieren Sektionen und Einträge im Bewerbungs-Builder
# (scripts/bewerbung.py, scripts/generate_application.py). Website und CV-PDF
# lesen sie nicht; einmal vergebene ids sollten aber stabil bleiben, sonst
# laufen bestehende Bewerbungsdateien ins Leere.
sections:
  - title: "Ausgewählte Projekte & Use Cases"
    id: projekte
    type: cards
    cards:
      - role: "Literaturprüfer"
        id: literaturpruefer
        problem: >-
          Halluzinierte oder falsch zitierte Quellen in Literaturverzeichnissen
          aufzuspüren kostet im Lektorat Stunden Handarbeit.
        solution: >-
          macOS-App, die jeden Eintrag über einen Langdock-Agenten per API gegen
          Fachdatenbanken abgleicht und fehlerhafte oder erfundene Titel automatisch
          markiert.
        result: >-
          Aus rund zwei Stunden Prüfung wurden etwa zehn Minuten. Im Team eingeführt
          und von drei Kolleg:innen genutzt.
        links:
          - label: "Literaturprüfer auf GitHub"
            url: "https://github.com/ecklex/literaturpruefer"
        video: "assets/video/literaturpruefer-demo.mp4"
        video_alt: "Bildschirmaufnahme: Demo der macOS-App Literaturprüfer beim Abgleich von Literaturverzeichnissen"
        video_desc: >-
          Die Aufnahme zeigt, wie die App ein Literaturverzeichnis einliest, die Einträge
          per API abgleicht und fehlerhafte Quellen automatisch markiert.
      - role: "AIdit"
        id: aidit
        problem: >-
          Wiederkehrende Textkorrekturen binden Zeit im Lektorat — und Cloud-KI ist bei
          unveröffentlichten Manuskripten keine Option.
        solution: >-
          Word-Add-in (Office.js), das Texte satzweise mit einem lokalen Sprachmodell
          über Ollama prüft und Verbesserungen als Kommentare einfügt, statt den Text
          automatisch zu ändern.
        result: >-
          Die Daten bleiben vollständig auf dem Rechner; die Autor:innen behalten die
          Kontrolle über jede einzelne Änderung.
        stack: "JavaScript, Office.js, Webpack; lokale LLMs über Ollama (z. B. qwen2.5)"
        links:
          - label: "LinkedIn-Post zu AIdit"
            url: "https://www.linkedin.com/posts/alexander-eckerlin_lektorat-ki-textkorrektur-activity-7421454350364962816--U7K?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAADVfgx8B6aVdfWPLdwYjkgMZcP-ib2FC3os"
          - label: "AIdit auf GitHub"
            url: "https://github.com/ecklex/AIdit"
        video: "assets/video/aidit-demo.mp4"
        video_alt: "Bildschirmaufnahme: Demo des Word-Add-ins AIdit bei der KI-gestützten Textkorrektur"
        video_desc: >-
          Die Aufnahme zeigt, wie das Add-in einen Word-Text absatzweise prüft und
          Korrekturvorschläge als Kommentare einfügt, ohne den Originaltext zu verändern.
      - role: "RAG-Bot for PDFs"
        id: rag-bot-pdfs
        problem: >-
          Antworten in umfangreichen PDF-Sammlungen zu finden ist mühsam — und die
          Dokumente sollen das Haus nicht verlassen.
        solution: >-
          Lokaler RAG-Bot, der Text aus PDFs extrahiert, in Embeddings überführt, mit
          FAISS durchsuchbar macht und Fragen über ein lokales LLM beantwortet.
        result: >-
          Beantwortet Fragen zu mehreren PDFs mit Belegstellen — vollständig offline,
          wahlweise per Weboberfläche oder Konsole.
        stack: "Python, PyMuPDF, SentenceTransformers, FAISS, Ollama (Mistral/Nous-Hermes), Gradio"
        links:
          - label: "RAG-Bot for PDFs auf GitHub"
            url: "https://github.com/ecklex/RAG-Bot-for-PDFs"
      - role: "autodocx (Single-Source-Publishing, prototypisch)"
        id: autodocx
        problem: >-
          Print- und Digitalfassungen aus einer Quelle erzeugen, ohne Inhalte doppelt
          pflegen zu müssen.
        solution: >-
          Prototyp einer Single-Source-Publishing-Pipeline auf Basis von XML/XSLT, die
          aus einer strukturierten Quelle mehrere Ausgabeformate erzeugt.
        result: >-
          Funktionsfähig aufgebaut, aber nicht produktiv ausgerollt — Grundlage für eine
          überarbeitete Pipeline, an der ich weiterarbeite.
        stack: "XML, XSLT, Python"
        links:
          - label: "autodocx auf GitHub"
            url: "https://github.com/ecklex/autodocx"

