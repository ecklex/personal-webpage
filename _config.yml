# _config.yml
title: Alexander Eckerlin
tagline: "KI-Werkzeuge bauen und einführen"  # kurzer Titel-Suffix (hält den <title>-Tag knapp)
description: "Ich entwickle KI-Werkzeuge für Fachabteilungen und führe sie ein — lokale LLMs, RAG, Prozessautomatisierung, digitale Barrierefreiheit."
# Kein `author:` hier: jekyll-seo-tag leitet daraus sonst ein kaputtes
# twitter:creator "@Alexander Eckerlin" ab. Der Autor wird stattdessen sauber
# über _includes/head-custom.html gesetzt.
lang: de
baseurl: "/personal-webpage"  # Subpfad für GitHub Pages Projektseite
url: "https://ecklex.github.io"  # dein GitHub Pages URL

# Theme
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Kein `twitter:`-Block hier: sonst erzeugt jekyll-seo-tag ein leeres
# twitter:site "@". Die große Bildkarte wird über head-custom.html gesetzt,
# das Bild liefert Open Graph (og:image).
