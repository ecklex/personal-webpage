sections:
  - title: Über mich
    text: >-
      Mein Weg verläuft quer: von der Germanistik über korpuslinguistische Forschung
      mit der Twitter-API ins Verlagslektorat, von dort zu bspw. XML und redaktioneller
      Automatisierung und schließlich zum Bau eigener KI-Werkzeuge. Was wie Umwege
      aussieht, ist mein Muster: Ich arbeite mich schnell in fremde Felder ein und
      verbinde sie. Ein KI-gestütztes Word-Add-In, eine macOS-App zur Literaturprüfung,
      ein lokaler RAG-Bot sind entstanden, weil ich ein redaktionelles Problem technisch
      lösen wollte.

  - title: "Ausgewählte Projekte"
    type: cards
    cards:
      - role: "Literaturprüfer"
        description: >-
          macOS-App, die halluzinierte und fehlerhafte Einträge in Literaturverzeichnissen
          automatisch erkennt und herausfiltert – ein Prüfschritt, der im Lektorat sonst
          viel Handarbeit kostet, in einem Bruchteil der Zeit. Gleicht die Einträge über
          einen Langdock-Agenten per API mit Datenbanken ab.
        video: "assets/video/literaturpruefer-demo.mp4"
        video_alt: "Bildschirmaufnahme: Demo der macOS-App Literaturprüfer beim Abgleich von Literaturverzeichnissen"
      - role: "AIdit"
        description: >-
          Word-Add-In, das Text mittels lokaler KI (Ollama) korrigiert.
        links:
          - label: "LinkedIn-Post"
            url: "https://www.linkedin.com/posts/alexander-eckerlin_lektorat-ki-textkorrektur-activity-7421454350364962816--U7K?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAADVfgx8B6aVdfWPLdwYjkgMZcP-ib2FC3os"
          - label: "GitHub Repo"
            url: "https://github.com/ecklex/AIdit"
        video: "assets/video/aidit-demo.mp4"
        video_alt: "Bildschirmaufnahme: Demo des Word-Add-Ins AIdit bei der KI-gestützten Textkorrektur"
      - role: "RAG-Bot for PDFs"
        description: >-
          Kleiner lokaler RAG-Bot, der Fragen zu PDF-Dokumenten beantworten kann.
        links:
          - label: GitHub Repo
            url: "https://github.com/ecklex/RAG-Bot-for-PDFs"

  - title: Berufserfahrung
    type: cards
    cards:
      - role: "Senior Managing Editor | Lektorat und Produktion"
        organization: "Carl-Auer Systeme Verlag GmbH, Heidelberg"
        date: "November 2021 – heute"
        description: >-
          Fachliche Koordination eines Programms von rund 150 Titeln seit 2021 im Team –
          von der konzeptionellen, sprachlichen und strukturellen Aufbereitung komplexer
          Fachinhalte (Wissenschaft, Beratung, Organisation) bis zur zielgruppengerechten
          Wissensvermittlung. Strukturierte Inhalte, Arbeit an medienneutraler Produktion
          (XML/Single-Source-Publishing) für Print und Digital; Prozessoptimierung und
          Aufbau einer automatisierten Single-Source-Publishing-Pipeline. Digitale
          Barrierefreiheit nach BFSG. KI-gestützte Redaktionsarbeit (LLM, RAG, lokale
          Sprachmodelle, Prompt Engineering) für Qualität und Effizienz. Crossfunktionale
          Zusammenarbeit mit Redaktion, Herstellung, Design und IT sowie
          Stakeholder-Abstimmung.
      - role: "Wissenschaftlicher Mitarbeiter"
        organization: "Ruprecht-Karls-Universität Heidelberg"
        date: "März 2021 – Oktober 2021"
        description: >-
          Im Forschungsprojekt "Culture Wars" der Universität Heidelberg habe ich über die Twitter-API Sprachdaten extrahiert und korpuslinguistisch untersucht.
