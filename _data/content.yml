    type: cards
    cards:
      - role: "Senior Managing Editor | Lektorat und Produktion"
        organization: "Carl-Auer Systeme Verlag GmbH, Heidelberg"
        date: "November 2021 – heute"
        description: >-
          Arbeit an der konzeptionellen, sprachlichen und strukturellen Aufbereitung
          komplexer fachlicher Inhalte (Wissenschaft, Beratung, Organisation).
          Verständliche Darstellung komplexen Wissens für unterschiedliche Zielgruppen.
          Entwicklung und Optimierung redaktioneller Workflows für Print und Digital.
          Digitale Barrierefreiheit und inhaltliche Zugänglichkeit.
          Enge Zusammenarbeit mit Redaktion, Herstellung, Design und IT.
          Einsatz technischer Werkzeuge (XML, XSLT, Automatisierung, KI) für Qualität
          und Effizienz.
