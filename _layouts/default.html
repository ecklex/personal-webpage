<!DOCTYPE html>
<html lang="{{ site.lang | default: "de" }}">
  <head>
    <meta charset="UTF-8">

{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b5c5c">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">Zum Inhalt springen.</a>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-owner">Alexander Eckerlin</span>
        <nav class="site-footer-links" aria-label="Kontakt und Profile">
          <a href="mailto:{{ site.data.content.email }}">E-Mail</a>
          <a href="https://www.linkedin.com/in/{{ site.data.content.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
          <a href="https://github.com/{{ site.data.content.github }}" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </footer>
    </main>
  </body>
</html>
