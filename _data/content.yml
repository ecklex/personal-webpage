name: Alexander Eckerlin
subtitle: "Komplexes Wissen verständlich und zugänglich machen | Content Design & Knowledge Communication | Content UX & Accessibility"
location: "Metropolregion Rhein-Neckar"
intro: >-
  In meiner Arbeit bewege ich mich an der Schnittstelle von Sprache, Inhalt,
  Technologie und Organisation. Als Lektor für wissenschaftliche und fachliche
  Publikationen habe ich gelernt, wie entscheidend Struktur, Ausdruck und
  Darstellung dafür sind, ob Inhalte zugänglich, anschlussfähig und nutzbar werden.

sections:
  - title: Über mich
    text: >-
      Besonders interessiert mich die frühe Phase von Projekten: Wenn noch offen ist,
      wie Wissen präsentiert, strukturiert oder vermittelt werden soll. Was braucht die
      Zielgruppe? Was kann ungestraft weggelassen werden? Dabei arbeite ich konzeptionell,
      forschend und oft prototypisch, um gute Lösungen sichtbar und testbar zu machen.
      Neben der redaktionellen Arbeit beschäftige ich mich mit digitalen Formaten,
      Barrierefreiheit und der Frage, wie sich komplexe Inhalte sinnvoll automatisieren
      lassen, ohne ihre Qualität zu verlieren. Ich suche Kontexte, in denen Denken,
      Struktur und Verständlichkeit und Wissen als etwas Lebendiges verstanden wird,
      das gestaltet werden muss.

