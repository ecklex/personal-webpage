name: Generate CV PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # WeasyPrint braucht Pango/Cairo (ueber Pango als System-Bibliotheken).
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libpangoft2-1.0-0 \
            fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate tagged PDF (PDF/UA-1)
        run: python scripts/generate_cv.py

      - name: Verify PDF accessibility
        run: python scripts/verify_pdf_a11y.py cv.pdf

      - name: Copy PDF to assets
        run: cp cv.pdf assets/cv-alexander-eckerlin.pdf

      - name: Commit and push PDF
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/cv-alexander-eckerlin.pdf
          git diff --staged --quiet || (git commit -m "chore: auto-generate CV PDF [skip ci]" && git push)
