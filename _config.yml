# _config.yml
title: Alexander Eckerlin
tagline: "KI-Werkzeuge bauen und einführen"  # kurzer Titel-Suffix (hält den <title>-Tag knapp)
description: "Ich entwickle KI-Werkzeuge für Fachabteilungen und führe sie ein — lokale LLMs, RAG, Prozessautomatisierung, digitale Barrierefreiheit."
# author als Mapping (nicht als String), sonst deutet jekyll-seo-tag den Namen
# als Twitter-Handle und erzeugt ein kaputtes twitter:creator "@Alexander Eckerlin".
author:
  name: Alexander Eckerlin
lang: de
baseurl: "/personal-webpage"  # Subpfad für GitHub Pages Projektseite
url: "https://ecklex.github.io"  # dein GitHub Pages URL

# Theme
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Größere Vorschaukarte beim Teilen (statt kleiner Thumbnail)
twitter:
  card: summary_large_image
